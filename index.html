<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>Mis Turnos</title>

<style>
:root{
  --green:#20a35a;
  --green-dark:#18894b;
  --green-soft:#eaf8f0;
  --blue:#2878d0;
  --orange:#e58b22;
  --red:#d64545;
  --text:#202124;
  --muted:#777b82;
  --line:#e7e8e9;
  --bg:#f6f7f6;
  --white:#fff;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:18px 12px 112px;
}
button{font:inherit}
.app{width:min(100%,560px);margin:auto}

.shell{
  background:var(--white);
  border-radius:30px;
  padding:24px 24px 22px;
  box-shadow:0 10px 32px rgba(0,0,0,.07);
}

/* ---------- ENCABEZADO ---------- */
.app-header{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}
.app-logo{
  width:80px;
  height:80px;
  border:3px solid var(--green);
  border-radius:22px;
  display:grid;
  place-items:center;
  flex:none;
}
.app-logo svg{width:56px;height:56px}
.app-title{flex:1;min-width:0}
.app-title h1{
  margin:0;
  font-size:31px;
  line-height:1.05;
  font-weight:850;
  letter-spacing:-.7px;
}
.app-title .sub{
  margin-top:6px;
  color:var(--muted);
  font-size:20px;
  line-height:1.1;
}
.settings-btn{
  width:62px;
  height:62px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:20px;
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:none;
}
.settings-btn svg{width:35px;height:35px}

/* ---------- VISTAS ---------- */
.view{display:none}
.view.active{display:block}

/* ---------- TARJETA HOY ---------- */
.today-card{
  border:1px solid #e5e7e6;
  border-radius:25px;
  padding:24px 22px 20px;
  text-align:center;
  background:#fff;
}
.eyebrow{
  font-size:27px;
  line-height:1;
  font-weight:850;
}
.today-date{
  margin-top:9px;
  color:var(--muted);
  font-size:24px;
  line-height:1.15;
}
.shift-circle{
  width:190px;
  height:190px;
  margin:22px auto 15px;
  border-radius:50%;
  display:grid;
  place-items:center;
}
.shift-circle svg{width:112px;height:112px}
.shift-circle.morning,
.shift-circle.afternoon{background:var(--blue)}
.shift-circle.free{background:var(--green)}

.today-status{
  font-size:45px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}
.today-status.morning{color:var(--blue)}
.today-status.afternoon{color:var(--orange)}
.today-status.free{color:var(--green)}

.today-message{
  margin-top:20px;
  padding:13px 12px;
  border-radius:13px;
  background:var(--green-soft);
  color:#2d8154;
  font-size:20px;
  line-height:1.1;
  font-weight:750;
}

/* ---------- DOS TARJETAS INFERIORES ---------- */
.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:18px;
}
.quick-card{
  min-height:275px;
  border:1px solid var(--line);
  border-radius:23px;
  padding:20px 14px 16px;
  text-align:center;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.quick-label{
  align-self:flex-start;
  text-align:left;
  width:100%;
  font-size:20px;
  line-height:1.1;
  font-weight:850;
}
.quick-date{
  margin-top:13px;
  font-size:24px;
  line-height:1.1;
  font-weight:800;
}
.quick-date.free{color:var(--green)}
.quick-icon{
  width:86px;
  height:86px;
  margin:12px auto 7px;
  display:grid;
  place-items:center;
}
.quick-icon svg{width:86px;height:86px}
.quick-type{
  margin-top:auto;
  font-size:28px;
  line-height:1;
  font-weight:850;
}
.quick-type.afternoon{color:var(--orange)}
.quick-type.morning{color:var(--blue)}
.quick-countdown{
  margin-top:9px;
  color:var(--muted);
  font-size:20px;
  line-height:1;
}

/* ---------- CALENDARIO ---------- */
.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.nav{
  width:58px;
  height:58px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  font-size:35px;
  line-height:1;
  cursor:pointer;
}
.title{text-align:center;flex:1;min-width:0}
.title h2{
  margin:0;
  font-size:28px;
  font-weight:850;
}
.title .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:16px;
}
.weekdays,.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}
.weekdays{margin-top:18px}
.wd{
  text-align:center;
  padding:7px 0;
  color:#666;
  font-size:15px;
  font-weight:800;
}
.wd.weekend{color:var(--red)}
.day{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.num{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  border:3px solid transparent;
}
.shift1 .num{color:var(--blue)}
.shift2 .num{color:var(--orange)}
.weekend .num{color:var(--red)}
.free .num{
  border-color:var(--green);
  color:var(--green);
  font-weight:900;
}
.free.weekend .num{border-color:var(--green);color:var(--red)}
.empty{height:68px}

.legend{
  border-top:1px solid var(--line);
  margin-top:10px;
  padding-top:16px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px 22px;
  font-size:14px;
  color:#666;
}
.legend-item{display:flex;align-items:center;gap:7px}
.swatch{width:13px;height:13px;border-radius:50%;display:inline-block}
.swatch.morning{background:var(--blue)}
.swatch.afternoon{background:var(--orange)}
.swatch.free-s{border:2px solid var(--green)}

.toolbar{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.action{
  flex:1;
  min-height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
}
.action.primary{background:#f3f7ff;border-color:#d9e6ff}
.notice{
  margin-top:12px;
  padding:12px 14px;
  border-radius:14px;
  background:#fafafa;
  font-size:13px;
  color:#666;
  line-height:1.45;
}
.notice strong{color:var(--text)}
.file{display:none}

.settings{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
  display:none;
}
.settings.open{display:block}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.toggle{accent-color:var(--green)}
select{
  font-size:16px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}
.status{margin-top:8px;color:var(--muted);font-size:12px}

/* ---------- NAVEGACIÓN INFERIOR ---------- */
.bottom-nav{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(540px,calc(100% - 28px));
  background:rgba(255,255,255,.98);
  border:1px solid var(--line);
  box-shadow:0 9px 28px rgba(0,0,0,.12);
  border-radius:24px;
  padding:8px 9px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  z-index:20;
}
.tab{
  min-width:0;
  min-height:74px;
  border:0;
  background:transparent;
  border-radius:17px;
  padding:8px 4px 6px;
  color:#777;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
}
.tab-icon{
  height:34px;
  display:grid;
  place-items:center;
  margin-bottom:3px;
}
.tab-icon svg{width:29px;height:29px}
.tab.active{
  background:var(--green-soft);
  color:var(--green);
}
.tab.active .tab-icon svg{stroke:var(--green)}

@media(max-width:430px){
  body{padding:12px 10px 104px}
  .shell{padding:18px 16px 18px;border-radius:28px}
  .app-header{gap:11px;margin-bottom:16px}
  .app-logo{width:66px;height:66px;border-radius:18px}
  .app-logo svg{width:47px;height:47px}
  .app-title h1{font-size:26px}
  .app-title .sub{font-size:17px;margin-top:4px}
  .settings-btn{width:54px;height:54px;border-radius:18px}
  .settings-btn svg{width:30px;height:30px}
  .today-card{padding:21px 14px 18px;border-radius:22px}
  .eyebrow{font-size:23px}
  .today-date{font-size:21px}
  .shift-circle{width:150px;height:150px;margin-top:20px}
  .shift-circle svg{width:91px;height:91px}
  .today-status{font-size:39px}
  .today-message{font-size:17px;margin-top:17px}
  .quick-grid{gap:10px;margin-top:16px}
  .quick-card{min-height:230px;padding:17px 10px 14px;border-radius:20px}
  .quick-label{font-size:17px}
  .quick-date{font-size:21px;margin-top:11px}
  .quick-icon,.quick-icon svg{width:72px;height:72px}
  .quick-type{font-size:25px}
  .quick-countdown{font-size:17px}
  .tab{font-size:12px;min-height:69px}
  .tab-icon svg{width:26px;height:26px}
}

@media(max-width:350px){
  .app-title h1{font-size:23px}
  .app-title .sub{font-size:15px}
  .today-date{font-size:18px}
  .today-status{font-size:34px}
  .quick-label{font-size:15px}
  .quick-date{font-size:18px}
  .quick-type{font-size:22px}
  .quick-countdown{font-size:15px}
  .tab{font-size:10px}
}
</style>
</head>

<body>
<main class="app">
<section class="shell">

<header class="app-header">
  <div class="app-logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none">
      <rect x="8" y="8" width="48" height="48" rx="9" stroke="currentColor" stroke-width="4"/>
      <path d="M16 22h32M20 5v10M44 5v10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="m19 37 9 9 18-20" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="app-title">
    <h1>Mis Turnos</h1>
    <div class="sub">Charles Paredes</div>
  </div>
  <button class="settings-btn" id="settingsBtn" type="button" aria-label="Ajustes">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="8" stroke="currentColor" stroke-width="4"/>
      <path d="M32 9v8M32 47v8M9 32h8M47 32h8M15.7 15.7l5.7 5.7M42.6 42.6l5.7 5.7M48.3 15.7l-5.7 5.7M21.4 42.6l-5.7 5.7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <path d="m38 13 3-4 5 3-1 5M51 38l4 3-3 5-5-1M26 51l-3 4-5-3 1-5M13 26l-4-3 3-5 5 1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<section id="homeView" class="view active">

  <div class="today-card">
    <div class="eyebrow">HOY</div>
    <div id="todayDate" class="today-date"></div>

    <div id="todayCircle" class="shift-circle morning" aria-hidden="true"></div>

    <div id="todayStatus" class="today-status morning">MAÑANA</div>
    <div id="todayMessage" class="today-message">¡Buen turno!</div>
  </div>

  <div class="quick-grid">

    <div class="quick-card">
      <div class="quick-label">Próximo turno</div>
      <div id="nextShiftDate" class="quick-date"></div>
      <div id="nextShiftIcon" class="quick-icon" aria-hidden="true"></div>
      <div id="nextShiftType" class="quick-type"></div>
    </div>

    <div class="quick-card">
      <div class="quick-label">Próximo día libre</div>
      <div id="nextFreeDate" class="quick-date free"></div>
      <div class="quick-icon" aria-hidden="true">
        <svg viewBox="0 0 120 100" fill="none">
          <path d="M20 58h80v20H20z" fill="#238bd0"/>
          <path d="M28 48c0-8 7-14 15-14h34c8 0 15 6 15 14v10H28z" fill="#2ba2df"/>
          <path d="M18 61v18M102 61v18M27 78v10M93 78v10" stroke="#2374a8" stroke-width="6" stroke-linecap="round"/>
          <path d="M91 10h4v25h-4z" fill="#d99b2b"/>
          <path d="M78 10c0-7 6-10 15-10s15 3 15 10v4H78z" fill="#ffd22e"/>
          <path d="M80 14h26" stroke="#f0a900" stroke-width="3"/>
        </svg>
      </div>
      <div id="nextFreeCountdown" class="quick-countdown"></div>
    </div>

  </div>
